# Push a version tag (git tag v1.0 && git push origin v1.0) and GitHub builds
# ScreenBuddy.exe and attaches it to a Release for people to download.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Make sure no personal sprite packs get shipped
        shell: pwsh
        run: if (Test-Path assets/luffy) { Write-Error "assets/luffy must not be bundled"; exit 1 }

      - name: Build ScreenBuddy.exe
        run: pyinstaller --onefile --windowed --name ScreenBuddy --add-data "assets;assets" main.py

      - uses: softprops/action-gh-release@v2
        with:
          name: Screen Buddy ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/ScreenBuddy.exe
